<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHG | Билеты на Три дня дождя</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">GHG AGENCY</div>
        <nav class="menu">
            <a href="index.html">Главная</a>
            <a href="catalog.html">Афиша</a>
            <a href="gallery.html">Галерея</a>
            <a href="contacts.html">Контакты</a>
        </nav>
    </header>

    <main class="container">
        <h1>Бронирование билетов: Три дня дождя</h1>
        <div class="card">
            <p><strong>Дата:</strong> 18 Ноября 2026</p>
            <p><strong>Площадка:</strong> Adrenaline Stadium</p>
        </div>

        <form action="https://formspree.io/f/xrednzzg" method="POST" class="form">
            <input type="hidden" name="artist" value="Три дня дождя">

            <label for="name">Ваше имя:</label>
            <input type="text" id="name" name="name" required placeholder="Иван Иванов">

            <label for="email">Ваш E-mail:</label>
            <input type="email" id="email" name="email" required placeholder="example@mail.ru">

            <label for="ticket_type">Тип билета:</label>
            <select id="ticket_type" name="ticket_type" required>
                <option value="dancefloor">Танцпол</option>
                <option value="fan">Фан-зона</option>
                <option value="vip">VIP стол</option>
            </select>

            <button type="submit" class="button">Забронировать билет</button>
        </form>
    </main>
</body>
